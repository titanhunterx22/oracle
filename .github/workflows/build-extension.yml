name: Build ORACLE extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify extension
        run: |
          npm run build:check
          test -f dist/manifest.json
          python -m py_compile companion/image-engine/server.py scripts/package_companion.py
          npm run build:companion
          test -f companion-dist/ORACLE-Creative-Studio-Engine.zip
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: ORACLE-browser-extension
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload local image engine installer
        uses: actions/upload-artifact@v4
        with:
          name: ORACLE-Creative-Studio-Engine
          path: companion-dist/ORACLE-Creative-Studio-Engine.zip
          if-no-files-found: error
          retention-days: 14
