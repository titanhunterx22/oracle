name: Build ORACLE extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify extension
        run: |
          npm run build:check
          test -f dist/manifest.json
          python -m py_compile companion/image-engine/server.py scripts/package_companion.py
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: ORACLE-browser-extension
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-windows-creative-engine:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up bundled build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install OpenVINO and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r companion/image-engine/requirements.txt
      - name: Build self-contained Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name ORACLE-Creative-Studio --collect-all openvino --collect-all openvino_genai --collect-all openvino_tokenizers --collect-all huggingface_hub --collect-all PIL --collect-all numpy --collect-all certifi companion/image-engine/server.py
          if (-not (Test-Path "dist/ORACLE-Creative-Studio/ORACLE-Creative-Studio.exe")) {
            throw "PyInstaller did not produce the standalone Creative Studio executable."
          }
      - name: Smoke-test bundled OpenVINO runtime
        shell: pwsh
        run: |
          $Exe = Join-Path (Get-Location) "dist/ORACLE-Creative-Studio/ORACLE-Creative-Studio.exe"
          $Headers = @{
            "Origin" = "edge-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            "X-ORACLE-Client" = "oracle-creative-studio-v1"
          }
          $Process = Start-Process -FilePath $Exe -WorkingDirectory (Split-Path $Exe) -PassThru -WindowStyle Hidden
          try {
            $Health = $null
            for ($Attempt = 0; $Attempt -lt 60; $Attempt++) {
              Start-Sleep -Seconds 1
              try {
                $Health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -Headers $Headers -TimeoutSec 10
                break
              } catch {
                if ($Process.HasExited) {
                  throw "The bundled image engine exited before its health check. Exit code: $($Process.ExitCode)"
                }
              }
            }
            if (-not $Health -or -not $Health.runtime_ready -or -not $Health.genai_available) {
              throw "Bundled OpenVINO/OpenVINO GenAI runtime health check failed."
            }
            if (-not $Health.devices -or $Health.devices.Count -lt 1) {
              throw "The bundled OpenVINO runtime did not detect any execution devices."
            }
            Write-Host ("Bundled OpenVINO runtime OK. Version: {0}; devices: {1}" -f $Health.openvino_version, ($Health.devices -join ", "))
          } finally {
            if ($Process -and -not $Process.HasExited) {
              Stop-Process -Id $Process.Id -Force
              Wait-Process -Id $Process.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
          }
      - name: Package standalone companion
        shell: pwsh
        run: |
          python scripts/package_companion.py
          if (-not (Test-Path "companion-dist/ORACLE-Creative-Studio-Engine.zip")) {
            throw "The standalone companion ZIP was not created."
          }
      - name: Upload standalone image engine installer
        uses: actions/upload-artifact@v4
        with:
          name: ORACLE-Creative-Studio-Engine
          path: companion-dist/ORACLE-Creative-Studio-Engine.zip
          if-no-files-found: error
          retention-days: 14
