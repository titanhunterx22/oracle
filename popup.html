<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ORACLE</title><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="popup.css"></head>
<body>
<canvas id="fx"></canvas>
<div class="shell">
  <header>
    <div class="popup-brand"><span class="popup-mark">O</span><div class="logo"><span>ORACLE</span><small><i></i><em data-orb-label data-state="idle">Idle</em></small></div></div>
    <div class="hbtns"><button class="btn sm" id="dash" title="Open the full dashboard"><span class="button-glyph">▦</span>Dashboard</button><button class="btn sm icon-btn" id="gear" title="Settings" aria-label="Settings">⚙</button></div>
  </header>
  <div class="orbwrap" id="orbwrap"><span class="orb-caption">YOUR PRIVATE BROWSER COMPANION</span></div>
  <div class="quick-head"><span>QUICK ACTIONS</span><small>Choose a starting point</small></div>
  <div class="quick" id="quick">
    <button class="btn sm primary" data-q="Summarise this page"><span>✦</span>Analyse page</button>
    <button class="btn sm" data-q="What are the main points?"><span>≡</span>Key points</button>
    <button class="btn sm" data-q="Explain this page simply"><span>◌</span>Explain simply</button>
    <button class="btn sm" data-q="Turn this into revision notes"><span>▤</span>Study</button>
    <button class="btn sm" data-q="Find the important dates"><span>◷</span>Facts</button>
    <button class="btn sm" data-q="Save this page"><span>☆</span>Save</button>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="composer" id="form"><input type="text" id="input" placeholder="Ask ORACLE about this page…" autocomplete="off" aria-label="Message"><button class="btn primary" type="submit">Send</button><button class="btn" type="button" id="clear" title="Clear conversation" aria-label="Clear conversation">⌫</button></form>
</div>
<script src="dictionary.js"></script><script src="engine.js"></script><script src="storage.js"></script><script src="tools.js"></script><script src="orb.js"></script><script src="palette.js"></script><script type="module" src="webllm-client.entry.js"></script><script src="local-ai.js"></script><script src="chat.js"></script><script src="popup.js"></script>
</body></html>
